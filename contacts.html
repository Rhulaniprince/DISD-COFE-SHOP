<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skinner Cofe</title>
    <link rel="stylesheet" href="CSS/Stylecon.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body style="background-color: #E8F5E9 ;">
     <div class="box">
      
    <!--NAVIGATION-->
    <nav>
         <div class="LOGO">
        <img src="Images/LOGO.jpg" style="width: 50px; height: 60px;" alt="">
        </div>
       <div class="navigations">
            <ul >
                <a href="Index.html">Home</a>
                <a href="Menu.html">MENU</a>
                <a href="gallery.html">gallery</a>
                <a href="About.html">About us</a>
                <a href="contacts.html">contacts</a>
            </ul>
        </div>
    </nav>
    <!--MAIN CONTENT
    CONTACT PAGE 
     Simple enquiry form: name, email, phone, and a comment field-->
    <main>
        <div class="contact-section">
            <h1>Contact</h1>
            <form class="contact-form">
                <div class="form-row">
                    <input type="text" name="name" placeholder="Name" required>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <input type="tel" name="phone" placeholder="Phone" class="full-width">
                <textarea name="comment" placeholder="Comment" class="full-width" rows="10"></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>
        <!--MAP-->
         <div class="map-section">
            <h2>Find Us</h2>
            <p>70 Juta St, Braamfontein, Johannesburg, 2001</p>
            <iframe
                id="map"
                title="Map showing the location of Skinner Café"
                src="https://www.google.com/maps?q=70+Juta+St,+Braamfontein,+Johannesburg,+2001&output=embed"
                loading="lazy" allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"></iframe>
            <div class="map-wrap">
                <a class="map-directions" target="_blank" rel="noopener"
                   href="https://www.google.com/maps/dir/?api=1&destination=70+Juta+St,+Braamfontein,+Johannesburg,+2001">Get directions</a>
            </div>
    </main>
    <!--Social links and copyright. Shared across every page.-->
    <footer>
        <div class="footer-content">
        <div class="social-links">
            <a href="https://www.instagram.com/skinner_cafe/?hl=en" target="_blank" aria-label="Instagram">
                <img src="Images/instagram-icon.jpg" alt="Instagram">
            </a>
            <a href="https://www.tiktok.com/@playbraam" target="_blank" aria-label="TikTok">
                <img src="Images/tiktok-icon.jpg" alt="TikTok">
            </a>
        </div>
        <p class="copyright">Copyright © 2026 Rhulani Nkuna ST10501757. All rights reserved. <br> Skinner Cofe</p>
    </div>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="JS/javascreapt.js"></script>
</body>
</html>
